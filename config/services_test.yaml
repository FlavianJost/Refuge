services:
    # Les fichiers envoyés pendant les tests sont stockés dans le cache afin de
    # ne pas polluer le dossier public/uploads.
    app.photo_uploader.animals:
        class: App\Service\PhotoUploader
        arguments:
            $targetDirectory: '%kernel.cache_dir%/test-uploads/animals'
            $prefix: 'animal_'

    app.photo_uploader.users:
        class: App\Service\PhotoUploader
        arguments:
            $targetDirectory: '%kernel.cache_dir%/test-uploads/users'
            $prefix: 'user_'
